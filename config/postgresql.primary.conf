# postgresql.conf — Nœud actif (primary) souverain
# PostgreSQL 16 — Réplication streaming synchrone
#
# À appliquer sur le nœud actif (machine client principale).
# Copier dans le répertoire de données PG (PGDATA) ou inclure via postgresql.conf.

# ── Connexions ───────────────────────────────────────────────────────────────
listen_addresses = '*'       # écoute sur toutes les interfaces
port             = 5432

# ── Write-Ahead Logging (WAL) ─────────────────────────────────────────────────
wal_level         = replica          # active le streaming replication
max_wal_senders   = 3                # max 3 standbys simultanés (spike : 1 suffira)
wal_keep_size     = 64               # MB — conserve 64 Mo de WAL pour rattrapage

# ── Réplication synchrone ─────────────────────────────────────────────────────
# CRITIQUE : synchronous_commit = on garantit que COMMIT retourne seulement
# après confirmation d'écriture sur le standby → pas de perte de données en cas
# de basculement immédiat. Contrepartie : latence légèrement supérieure.
synchronous_commit    = on
synchronous_standby_names = 'sovereign_standby'  # nom du standby (voir recovery.conf)

# ── Checkpoint ───────────────────────────────────────────────────────────────
checkpoint_completion_target = 0.9
max_wal_size                 = 1GB

# ── Logging (spike) ──────────────────────────────────────────────────────────
log_connections    = on
log_disconnections = on
log_replication_commands = on
