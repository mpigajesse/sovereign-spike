# postgresql.conf — Nœud standby (passif PG) souverain
# PostgreSQL 16
#
# Le standby reçoit le WAL du primary via streaming replication.
# En cas de failover, Patroni promeut ce standby → nouveau primary.
# Le standby répond aux lectures (hot_standby = on) mais redirige les écritures.

# ── Connexions ───────────────────────────────────────────────────────────────
listen_addresses = '*'
port             = 5432           # port standard sur la machine standby

# ── Mode standby ─────────────────────────────────────────────────────────────
hot_standby = on                  # permet les SELECT pendant la réplication
hot_standby_feedback = on         # évite les conflits de vacuum sur primary

# ── Identité du standby (pour synchronous_standby_names) ─────────────────────
# Ce nom doit correspondre à synchronous_standby_names sur le primary.
# Définir dans le fichier de configuration de récupération (postgresql.auto.conf
# ou via pg_basebackup + primary_conninfo).
#
# Exemple primary_conninfo à insérer dans postgresql.auto.conf du standby :
# primary_conninfo = 'host=PRIMARY_IP port=5432 user=replicator
#                     password=changeme_spike application_name=sovereign_standby'
# primary_slot_name = 'sovereign_slot'

# ── Logging ──────────────────────────────────────────────────────────────────
log_connections = on
