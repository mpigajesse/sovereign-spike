# patroni.yml — Configuration Patroni pour le failover automatique souverain
# PostgreSQL 16 — Spike Phase 0
#
# Patroni supervise le cluster primary/standby et orchestre les failovers.
# Il s'appuie sur un DCS (Distributed Configuration Store) pour le consensus.
# Pour le spike : etcd (simple, léger).
#
# Installation :
#   pip install patroni[etcd]         # Patroni + driver etcd
#   pip install python-etcd           # client etcd Python
#
# Lancement (sur chaque machine) :
#   patroni /path/to/patroni.yml

scope: sovereign-cluster
namespace: /sovereign/
name: sovereign-primary       # remplacer par le hostname réel

restapi:
  listen: 0.0.0.0:8008
  connect_address: 192.168.200.1:8008   # Windows physique (nœud actif)

etcd:
  hosts: 192.168.200.1:2379             # etcd sur le primary (spike : même machine)        # adresse du serveur etcd

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576  # 1 Mo de WAL max de retard pour éligibilité

  initdb:
    - encoding: UTF8
    - data-checksums

  pg_hba:
    - host replication replicator 0.0.0.0/0 scram-sha-256
    - host all         sovereign  0.0.0.0/0 scram-sha-256

  users:
    sovereign:
      password: sovereign
      options:
        - createdb
    replicator:
      password: replicator_spike
      options:
        - replication

postgresql:
  listen: 0.0.0.0:5432
  connect_address: 192.168.200.1:5432   # IP VMnet1 du nœud actif Windows

  data_dir: /var/lib/postgresql/16/main
  bin_dir:  /usr/lib/postgresql/16/bin
  pgpass:   /tmp/pgpass

  authentication:
    replication:
      username: replicator
      password: replicator_spike
    superuser:
      username: postgres
      password: postgres_spike

  parameters:
    wal_level:               replica
    max_wal_senders:         3
    wal_keep_size:           64
    synchronous_commit:      on
    synchronous_standby_names: sovereign_standby
    hot_standby:             on
    hot_standby_feedback:    on
    log_connections:         on
    log_replication_commands: on

  # ── FENCING — commande exécutée sur le nouveau primary après promotion ────────
  # Incrémente l'époque dans la DB → neutralise immédiatement l'ancien primary.
  # L'ancien primary détectera le mismatch d'époque dans sa prochaine transaction.
  promote_command: >-
    psql -U sovereign -d sovereign_active -c
    "UPDATE node_epoch
     SET epoch = epoch + 1,
         promoted_at = NOW(),
         primary_host = '$(hostname)'
     WHERE id = 1"

  # Commande exécutée avant la dégradation d'un nœud → stoppe les écritures
  before_stop: >-
    psql -U sovereign -d sovereign_active -c
    "SELECT pg_terminate_backend(pid)
     FROM pg_stat_activity
     WHERE application_name = 'sovereign-node-active'"

tags:
  nofailover:   false
  noloadbalance: false
  clonefrom:    false
  nosync:       false
