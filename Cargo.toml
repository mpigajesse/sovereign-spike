[workspace]
members = [
    "crates/core",
    "crates/node",
    "crates/relay",
    "crates/tauri-app/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
sodiumoxide   = "0.2"
ciborium      = "0.2"
serde         = { version = "1", features = ["derive"] }
serde_bytes   = "0.11"
uuid          = { version = "1", features = ["v4", "serde"] }
chrono        = { version = "0.4", features = ["serde"] }
thiserror     = "1"
tokio         = { version = "1", features = ["full"] }
axum          = "0.7"
reqwest       = { version = "0.11", features = ["json"] }
sqlx          = { version = "0.7", features = ["postgres", "sqlite", "runtime-tokio", "macros", "migrate", "uuid", "chrono"] }
anyhow        = "1"
hex           = "0.4"
sha2          = "0.10"
serde_json    = "1"
async-trait   = "0.1"
tauri         = { version = "2", features = [] }
tauri-build   = { version = "2", features = [] }
tauri-plugin-shell = "2"
tracing       = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
