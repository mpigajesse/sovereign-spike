[package]
name    = "sovereign-relay"
version.workspace = true
edition = "2021"

# ⚠ INTENTIONNEL : sovereign-core N'EST PAS une dépendance du relais.
# Le relais ne connaît aucune primitive crypto, aucune DEK, aucun schéma CBOR.
# Il manipule uniquement des octets opaques — zero-knowledge par construction.
# Un auditeur peut vérifier cette propriété en lisant ce fichier.

[dependencies]
tokio.workspace              = true
axum.workspace               = true
serde.workspace              = true
thiserror.workspace          = true
tracing.workspace            = true
tracing-subscriber.workspace = true
uuid.workspace               = true
chrono.workspace             = true
anyhow.workspace             = true

[dev-dependencies]
tower      = { version = "0.5", features = ["util"] }
serde_json = "1"
